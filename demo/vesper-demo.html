<!DOCTYPE html>
<!--
  Vesper — self-running demo.

  A faithful browser port of the game's simulation and renderer (drift,
  wobble, chain physics, per-family particle shapes, point whispers, the
  synthesized pop sound) driven by a scripted "director" that plays a
  ~35 second session on its own and loops forever.

  Open directly in a browser (click once anywhere to enable sound), or
  record a video with `node run-demo.js`. Talk track: DEMO_SCRIPT.md.
-->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Vesper Pop</title>
<style>
  :root {
    --serif: Georgia, "Iowan Old Style", "Liberation Serif", serif;
    --sans: -apple-system, "Helvetica Neue", Arial, "Liberation Sans", sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #09080E; }
  body { font-family: var(--sans); position: relative; cursor: default; }
  canvas { position: absolute; inset: 0; }

  .hud { position: absolute; top: 44px; left: 0; right: 0; text-align: center;
         pointer-events: none; }
  .count { font-family: var(--serif); font-weight: 300; font-size: 62px; color: #F4F2FA;
           line-height: 1.05; font-variant-numeric: tabular-nums;
           transition: transform 0.12s ease; }
  .count.pulse { transform: scale(1.1); }
  .detonated { font-size: 9px; letter-spacing: 4px; color: #8B86A3; font-weight: 500;
               margin-top: 8px; }
  .sessionpts { font-size: 9px; letter-spacing: 1.5px; color: rgba(139,134,163,0.8);
                margin-top: 4px; min-height: 12px; }
  .chainnote, .unlocknote { font-family: var(--serif); font-style: italic; font-size: 11px;
              margin-top: 6px; min-height: 15px; opacity: 0; transition: opacity 0.4s ease; }
  .chainnote { color: rgba(195,175,220,0.75); }
  .unlocknote { color: rgba(214,204,230,0.9); }
  .unlocknote span { padding: 7px 14px; background: rgba(24,22,34,0.85); border-radius: 999px;
                     border: 1px solid rgba(255,255,255,0.12); }
  .show { opacity: 1 !important; }

  .cardwrap { position: absolute; inset: 0; display: flex; align-items: center;
              justify-content: center; pointer-events: none; opacity: 0;
              transform: scale(0.95); transition: opacity 0.45s ease, transform 0.45s ease; }
  .cardwrap.show { opacity: 1; transform: scale(1); }
  .fortune { max-width: 290px; padding: 24px 30px; background: rgba(24,22,34,0.92);
             border: 1px solid rgba(255,255,255,0.12); border-radius: 18px; text-align: center;
             box-shadow: 0 12px 30px rgba(0,0,0,0.4); }
  .fortune .star { font-size: 15px; color: rgba(214,204,230,0.85); margin-bottom: 10px; }
  .fortune .msg { font-family: var(--serif); font-style: italic; font-size: 15px;
                  line-height: 1.55; color: #E8E4F2; }

  .scrim { position: absolute; inset: 0; background: rgba(14,13,20,0.55); opacity: 0;
           transition: opacity 0.5s ease; pointer-events: none; }
  .scrim.show { opacity: 1; }
  .done { max-width: 340px; padding: 44px; background: rgba(22,20,32,0.9);
          border: 1px solid rgba(255,255,255,0.1); border-radius: 22px; text-align: center;
          box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
  .done .check { width: 52px; height: 52px; border: 1px solid rgba(255,255,255,0.3);
                 border-radius: 50%; margin: 0 auto 22px; display: flex; align-items: center;
                 justify-content: center; color: #ECEAF4; font-size: 20px; }
  .done h1 { font-family: var(--serif); font-weight: 300; font-size: 30px; color: #fff;
             margin-bottom: 12px; }
  .done .sub { font-size: 13.5px; line-height: 1.45; color: #9B95B2; margin-bottom: 10px; }
  .done .pts { font-family: var(--serif); font-style: italic; font-size: 12px;
               color: rgba(195,175,220,0.9); margin-bottom: 6px; }
  .done .life { font-family: var(--serif); font-style: italic; font-size: 11px;
                color: rgba(139,134,163,0.8); margin-bottom: 24px; }
  .done .go { display: inline-block; padding: 13px 30px; border-radius: 11px;
              background: #E9E6F4; color: #12111A; font-size: 12px; font-weight: 600;
              letter-spacing: 2px; }

  .tapdot { position: absolute; width: 30px; height: 30px; border-radius: 50%;
            border: 1.5px solid rgba(236,234,244,0.7); transform: translate(-50%, -50%) scale(0.4);
            opacity: 0; pointer-events: none; }
  .tapdot.go { animation: tap 0.45s ease-out; }
  @keyframes tap {
    0% { opacity: 0.9; transform: translate(-50%, -50%) scale(0.4); }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(1.5); }
  }
  .soundhint { position: absolute; bottom: 26px; left: 0; right: 0; text-align: center;
               font-size: 10px; letter-spacing: 2px; color: rgba(139,134,163,0.6);
               pointer-events: none; transition: opacity 0.6s ease; }

  .topbar { position: absolute; top: 44px; left: 22px; right: 22px; display: flex; gap: 8px; }
  .btn { width: 44px; height: 44px; border-radius: 12px; background: rgba(20,18,32,0.55);
         border: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center;
         justify-content: center; cursor: pointer; }
  .btn svg { stroke: #ECEAF4; fill: none; stroke-width: 1.6; stroke-linecap: round; }
  .spacer { flex: 1; }

  .sheet { position: absolute; left: 0; right: 0; bottom: 0; top: 56px; background: #100F18;
           border-radius: 24px 24px 0 0; padding: 14px 24px 24px; overflow-y: auto;
           box-shadow: 0 -18px 50px rgba(0,0,0,0.55); }
  .grabber { width: 36px; height: 5px; border-radius: 3px; background: rgba(255,255,255,0.18);
             margin: 0 auto 18px; }
  .sheet h1 { font-family: var(--serif); font-weight: 300; font-size: 24px; color: #ECEAF4; }
  .sheet .subtitle { font-size: 11px; color: #9B95B2; margin-top: 2px; }
  .sheet .x { position: absolute; top: 24px; right: 20px; color: #9B95B2; font-size: 15px;
              width: 44px; height: 44px; display: flex; align-items: center;
              justify-content: center; cursor: pointer; }
  .label { font-size: 9px; letter-spacing: 3px; color: #9B95B2; font-weight: 500;
           text-transform: uppercase; }
  .pathmap { position: relative; }
  .roads { position: absolute; inset: 0; }
  .stone { position: absolute; transform: translate(-50%, -50%); text-align: center;
           cursor: pointer; }
  .stone .circ { width: 48px; height: 48px; border-radius: 50%; background: rgba(24,22,34,0.9);
                 border: 1px solid rgba(255,255,255,0.28); display: flex; align-items: center;
                 justify-content: center; gap: 4px; margin: 0 auto; position: relative; }
  .stone .pd { width: 8px; height: 8px; border-radius: 50%; }
  .stone.active .circ { border: 2px solid #C3AFDC; box-shadow: 0 0 18px rgba(195,175,220,0.35); }
  .stone.cleared { opacity: 0.55; }
  .stone .check { position: absolute; bottom: 3px; left: 0; right: 0; font-size: 8px;
                  color: rgba(155,149,178,0.85); }
  .stone .nm { font-size: 8.5px; color: #9B95B2; margin-top: 6px; max-width: 96px;
               overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pathcap { text-align: center; font-family: var(--serif); font-style: italic; font-size: 11px;
             color: rgba(155,149,178,0.7); margin-top: 8px; }
  .jpoints { font-family: var(--serif); font-weight: 300; font-size: 44px; color: #ECEAF4;
             font-variant-numeric: tabular-nums; margin-top: 16px; }
  .records { display: flex; margin-top: 16px; padding: 14px 0; background: rgba(24,22,34,0.6);
             border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; }
  .rec { flex: 1; text-align: center; }
  .rec .v { font-family: var(--serif); font-weight: 300; font-size: 17px; color: #ECEAF4;
            font-variant-numeric: tabular-nums; }
  .rec .k { font-size: 9px; letter-spacing: 1px; color: #9B95B2; margin-top: 3px; }
  .cells { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: 14px; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 5px; }
  .cell .dot { width: 30px; height: 30px; border-radius: 50%; }
  .cell .nm { font-size: 9px; color: #9B95B2; }
  .cell .ct { font-size: 8px; color: rgba(110,104,127,0.9); font-variant-numeric: tabular-nums; }
  .sheetnote { font-family: var(--serif); font-style: italic; font-size: 11px;
               color: rgba(155,149,178,0.7); margin-top: 20px; text-align: center; }
  .togglerow { display: flex; align-items: center; justify-content: space-between;
               margin-top: 20px; cursor: pointer; }
  .togglerow .t1 { font-size: 15px; color: #ECEAF4; }
  .togglerow .t2 { font-size: 12px; color: #9B95B2; margin-top: 2px; }
  .switch { width: 46px; height: 28px; border-radius: 14px; background: #1E1C2B;
            border: 1px solid rgba(255,255,255,0.1); position: relative; flex-shrink: 0;
            transition: background 0.2s ease; }
  .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 22px;
                   height: 22px; border-radius: 50%; background: #9B95B2;
                   transition: left 0.2s ease, background 0.2s ease; }
  .switch.on { background: #C3AFDC; }
  .switch.on::after { left: 20px; background: #16151F; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud">
  <div class="count" id="count">0</div>
  <div class="detonated">DETONATED</div>
  <div class="sessionpts" id="pts"></div>
  <div class="chainnote" id="chain"></div>
  <div class="unlocknote" id="unlock"></div>
</div>
<div class="cardwrap" id="fortunewrap">
  <div class="fortune"><div class="star">✦</div><div class="msg" id="fortunemsg"></div></div>
</div>
<div class="scrim" id="scrim"></div>
<div class="cardwrap" id="donewrap">
  <div class="done">
    <div class="check">✓</div>
    <h1>Nicely done.</h1>
    <div class="sub" id="donesub"></div>
    <div class="pts" id="donepts"></div>
    <div class="life" id="donelife"></div>
    <div class="go" id="goagain" style="pointer-events:auto; cursor:pointer;">GO AGAIN</div>
  </div>
</div>
<div class="topbar" id="topbar"></div>
<div class="tapdot" id="tapdot"></div>
<div class="soundhint" id="soundhint">WATCHING THE DEMO · TAP AN ORB TO PLAY</div>
<div id="sheetroot"></div>

<script>
// ---------- setup ----------
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
let W = innerWidth, H = innerHeight, DPR = Math.min(devicePixelRatio || 1, 3);
function fit() {
  W = innerWidth; H = innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  canvas.style.width = W + "px"; canvas.style.height = H + "px";
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
fit(); addEventListener("resize", fit);

let seedState = 20260815;
function rnd(a = 0, b = 1) {
  seedState = (seedState + 0x6D2B79F5) | 0;
  let t = Math.imul(seedState ^ (seedState >>> 15), 1 | seedState);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return a + (b - a) * (((t ^ (t >>> 14)) >>> 0) / 4294967296);
}

// ---------- pops (a taste of the catalog: paints, shapes, sound, rarity) ----------
const pv = (r, g, b) => ({ fill: [r, g, b], glow: [r * 0.93, g * 0.89, b * 0.95] });
const POPS = {
  vesper: { rarity: 10, shape: "dot", grav: 0.07, snd: { f: 460, spread: 420, sweep: 0.55, dur: 0.14, dec: 7.5, bright: 0 },
            paints: [ { fill: [233,230,242], glow: [223,220,238] }, { fill: [231,213,192], glow: [220,190,160] },
                      { fill: [217,201,230], glow: [195,175,220] }, { fill: [198,220,216], glow: [175,205,198] },
                      { fill: [230,205,212], glow: [220,180,190] } ] },
  ember:  { rarity: 10, shape: "spark", grav: 0.09, snd: { f: 380, spread: 380, sweep: 0.5, dur: 0.12, dec: 8.5, bright: 0.15 },
            paints: [pv(233,199,171), pv(226,184,152)] },
  clover: { rarity: 10, shape: "petal", grav: 0.03, snd: { f: 470, spread: 380, sweep: 0.62, dur: 0.15, dec: 6.5, bright: 0 },
            paints: [pv(204,224,202), pv(191,216,189)] },
  tide:   { rarity: 10, shape: "dot", grav: 0.04, snd: { f: 320, spread: 260, sweep: 0.6, dur: 0.2, dec: 6, bright: 0 },
            paints: [pv(190,212,224), pv(176,202,217)] },
  frost:  { rarity: 10, shape: "shard", grav: 0.05, snd: { f: 620, spread: 460, sweep: 0.5, dur: 0.11, dec: 9, bright: 0.3 },
            paints: [pv(222,232,240), pv(211,224,236)] },
  chime:  { rarity: 10, shape: "ring", grav: 0.07, snd: { f: 520, spread: 440, sweep: 0.66, dur: 0.3, dec: 5, bright: 0.2 },
            paints: [pv(238,226,196), pv(232,217,182)] },
  pearl:  { rarity: 25, shape: "dot", grav: 0.05, snd: { f: 420, spread: 340, sweep: 0.6, dur: 0.16, dec: 6.5, bright: 0.12 },
            paints: [pv(236,233,230)] },
};
const rgba = (c, a) => `rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;

// ---------- sound (the game's actual synthesis, in WebAudio) ----------
let audio = null;
function enableSound() {
  if (audio) return;
  audio = new (window.AudioContext || window.webkitAudioContext)();
}

// tap an orb to take over from the demo director (exactly the game's hit
// test: radius + 12pt tolerance, topmost orb first)
addEventListener("pointerdown", e => {
  enableSound();
  if (doneShown || sheetOpen || e.target.id !== "c") return;
  for (let i = orbs.length - 1; i >= 0; i--) {
    const o = orbs[i];
    if (!o.alive) continue;
    const dx = e.clientX - o.x, dy = e.clientY - o.y, rr = o.r + 12;
    if (dx * dx + dy * dy <= rr * rr) {
      if (!manual) {
        manual = true;
        document.getElementById("soundhint").textContent = "YOURS NOW · CLEAR THE FIELD";
        setTimeout(() => document.getElementById("soundhint").style.opacity = 0, 2500);
      }
      tapMarker(o.x, o.y);
      detonate(o, false);
      return;
    }
  }
});

function playPop(pop, pitch) {
  if (!soundOn || !audio || audio.state !== "running") return;
  const sr = audio.sampleRate, dur = pop.snd.dur;
  const buf = audio.createBuffer(1, Math.floor(sr * dur), sr);
  const ch = buf.getChannelData(0);
  const start = pop.snd.f + pitch * pop.snd.spread + rnd(-12, 12);
  const end = start * pop.snd.sweep;
  for (let i = 0; i < ch.length; i++) {
    const t = i / sr, p = t / dur;
    const freq = start + (end - start) * p;
    const phase = 2 * Math.PI * freq * t;
    const attack = Math.sin(Math.min(1, p * 40) * Math.PI / 2);
    const decay = Math.exp(-p * pop.snd.dec);
    let s = Math.sin(phase) + Math.sin(phase * 2) * pop.snd.bright;
    ch[i] = s / (1 + pop.snd.bright) * attack * decay * 0.5;
  }
  const src = audio.createBufferSource();
  src.buffer = buf; src.connect(audio.destination); src.start();
}

function playChime() {
  if (!soundOn || !audio || audio.state !== "running") return;
  const sr = audio.sampleRate;
  const buf = audio.createBuffer(1, Math.floor(sr * 1.8), sr);
  const ch = buf.getChannelData(0);
  const notes = [[523.25, 0], [659.25, 0.28], [783.99, 0.56]];
  for (let i = 0; i < ch.length; i++) {
    const t = i / sr; let s = 0;
    for (const [f, st] of notes) if (t >= st) {
      const nt = t - st;
      s += Math.sin(2 * Math.PI * f * nt) * Math.min(1, nt * 30) * Math.exp(-nt * 2.6) * 0.12;
    }
    ch[i] = s;
  }
  const src = audio.createBufferSource();
  src.buffer = buf; src.connect(audio.destination); src.start();
}

// ---------- simulation (ports GameSimulation, f = one 60fps frame) ----------
let orbs = [], particles = [], rings = [], motes = [], notes = [];
let count = 0, sessionPts = 0, lifetime = 12431, chainStreak = 0, lastPopAt = -9;
let now = 0, manual = false, doneShown = false;
let soundOn = true, whispersOn = true, sheetOpen = null, totalPts = 0;
const NAMES = { vesper: "Vesper", ember: "Ember", clover: "Clover", tide: "Tide",
                frost: "Frost", chime: "Chime", pearl: "Pearl" };
const stats = { pops: 0, fields: 0, fortunes: 0, best: 0 };
const perPop = {};

// the demo's little Path: same rules as the game — clearing a stone opens
// 1–3 roads with pops distinct from the parent's; every stone is playable
let mapStones = [{ id: 1, parent: null, gen: 0, lane: 0.5, pops: ["vesper"], cleared: false }];
let nextStoneId = 2, activeStoneId = null;

function spawnRoads(stone) {
  if (mapStones.some(s => s.parent === stone.id)) return [];
  const roll = rnd();
  const n = roll < 0.45 ? 1 : roll < 0.9 ? 2 : 3;
  const keys = Object.keys(POPS);
  const avoid = new Set(stone.pops);
  const kids = [];
  for (let k = 0; k < n; k++) {
    const roll2 = rnd();
    const cnt = roll2 < 0.5 ? 1 : roll2 < 0.9 ? 2 : 3;
    let pool = keys.filter(p => !avoid.has(p));
    if (!pool.length) pool = keys.slice();
    const pops = [];
    while (pops.length < cnt && pool.length) {
      pops.push(pool.splice((rnd(0, pool.length)) | 0, 1)[0]);
    }
    pops.forEach(p => avoid.add(p));
    const spread = n === 1 ? rnd(-0.16, 0.16) : (k / (n - 1) - 0.5) * 0.5 + rnd(-0.05, 0.05);
    kids.push({ id: nextStoneId++, parent: stone.id, gen: stone.gen + 1,
                lane: Math.min(0.9, Math.max(0.1, stone.lane + spread)),
                pops, cleared: false });
  }
  mapStones.push(...kids);
  return kids;
}

// a fresh random field from a list of pops (edge insets as in the game)
function makeLayout(popList) {
  const out = [];
  let tries = 0;
  while (out.length < 11 && tries < 400) {
    tries++;
    const r = rnd(18, 34);
    const x = rnd(0.09, 0.91), y = rnd(0.16, 0.93);
    const px = x * W, py = y * H;
    if (out.some(o => Math.hypot(o._px - px, o._py - py) < o.r + r + 16)) continue;
    out.push({ x, y, r, pop: popList[(rnd(0, popList.length)) | 0], _px: px, _py: py });
  }
  out[(rnd(0, out.length)) | 0].fortune = true;
  return out;
}

function currentLayout() {
  const stone = mapStones.find(s => s.id === activeStoneId);
  return stone ? makeLayout(stone.pops) : makeLayout(Object.keys(POPS));
}

function seedMotes() {
  motes = [];
  for (let i = 0; i < 36; i++) motes.push({
    x: rnd(0, W), y: rnd(0, H), vx: rnd(-0.05, 0.05), vy: rnd(-0.08, -0.02),
    s: rnd(0.8, 2.2), a: rnd(0.04, 0.12), ph: rnd(0, 7) });
}

function seedField(layout) {
  orbs = layout.map(o => ({
    x: o.x * W, y: o.y * H, r: o.r, baseR: o.r,
    vx: rnd(-0.18, 0.18), vy: rnd(-0.18, 0.18),
    pop: POPS[o.pop], popName: o.pop,
    paint: POPS[o.pop].paints[(rnd(0, POPS[o.pop].paints.length)) | 0],
    ph: rnd(0, 7), alive: true, fortune: !!o.fortune }));
  count = 0; sessionPts = 0;
  setText("count", 0); setText("pts", "");
}

function detonate(o, chained) {
  if (!o.alive) return;
  o.alive = false;
  count++;
  const sizeNorm = (o.baseR - 18) / 16;
  playPop(o.pop, 1 - sizeNorm);

  // points: rarity × size × chain multiplier (docs/pop_points.md)
  if (now - lastPopAt < 0.9) chainStreak++; else chainStreak = 1;
  lastPopAt = now;
  const mult = Math.min(1 + 0.1 * (chainStreak - 1), 2);
  let pts = Math.round(o.pop.rarity * (1 + 0.5 * sizeNorm) * mult + (o.fortune ? 50 : 0));
  sessionPts += pts; totalPts += pts; lifetime++;
  stats.pops++; perPop[o.popName] = (perPop[o.popName] || 0) + 1;
  if (chainStreak > stats.best) stats.best = chainStreak;
  if (whispersOn) notes.push({ x: o.x, y: o.y - o.baseR - 8, text: "+" + pts, life: 1 });
  if (chainStreak >= 3) flash("chain", "chain of " + chainStreak, 1600);

  const n = 18 + o.baseR | 0;
  const strength = o.baseR / 34;
  for (let i = 0; i < n; i++) {
    const a = rnd(0, Math.PI * 2), sp = rnd(1.2, 6) * (0.7 + strength);
    particles.push({ x: o.x, y: o.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - rnd(0, 0.8),
                     life: 1, decay: rnd(0.01, 0.024), s: rnd(1.2, 3.4),
                     pop: o.pop, paint: o.paint });
  }
  rings.push({ x: o.x, y: o.y, r: o.baseR * 0.5, maxR: 110 + o.baseR * 2.6, life: 1,
               paint: o.paint, popped: chained });

  setText("count", count);
  setText("pts", sessionPts + " pop points");
  const el = document.getElementById("count");
  el.classList.add("pulse"); setTimeout(() => el.classList.remove("pulse"), 130);
  if (o.fortune) showFortune();

  if (!doneShown && orbs.every(x => !x.alive)) {
    doneShown = true;
    setTimeout(doneSequence, 650);
  }
}

function step(f) {
  now += f / 60;
  for (const o of orbs) {
    if (!o.alive) continue;
    o.x += o.vx * f; o.y += o.vy * f; o.ph += 0.02 * f;
    if (o.x < o.r) { o.x = o.r; o.vx = Math.abs(o.vx); }
    if (o.x > W - o.r) { o.x = W - o.r; o.vx = -Math.abs(o.vx); }
    if (o.y < o.r + 70) { o.y = o.r + 70; o.vy = Math.abs(o.vy); }
    if (o.y > H - o.r) { o.y = H - o.r; o.vy = -Math.abs(o.vy); }
    o.r = o.baseR * (1 + Math.sin(o.ph) * 0.03);
  }
  const rc = rings.length;
  for (let i = 0; i < rc; i++) {
    const r = rings[i];
    r.r += (r.maxR - r.r) * 0.1 * f + 1.5 * f;
    r.life -= 0.03 * f;
    if (!r.popped && r.r > 18) {
      for (const o of orbs) {
        if (!o.alive) continue;
        const d = Math.hypot(o.x - r.x, o.y - r.y);
        if (d < r.r + o.r && d > r.r - 24) detonate(o, true);
      }
      if (r.r > r.maxR * 0.5) r.popped = true;
    }
  }
  rings = rings.filter(r => r.life > 0);
  const damp = Math.pow(0.986, f);
  for (const p of particles) {
    p.vy += p.pop.grav * f; p.vx *= damp; p.vy *= damp;
    p.x += p.vx * f; p.y += p.vy * f; p.life -= p.decay * f;
  }
  particles = particles.filter(p => p.life > 0);
  for (const m of motes) {
    m.x += m.vx * f; m.y += m.vy * f; m.ph += 0.008 * f;
    if (m.y < -4) m.y = H + 4; if (m.x < -4) m.x = W + 4; if (m.x > W + 4) m.x = -4;
  }
  for (const n of notes) { n.y -= 0.35 * f; n.life -= 0.016 * f; }
  notes = notes.filter(n => n.life > 0);
}

// ---------- rendering (ports SceneRenderer) ----------
function draw() {
  const g = ctx.createRadialGradient(W / 2, H * 0.3, 0, W / 2, H * 0.3, 700);
  g.addColorStop(0, "#16151F"); g.addColorStop(0.5, "#100F18"); g.addColorStop(1, "#09080E");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  ctx.globalCompositeOperation = "lighter";
  for (const m of motes) {
    ctx.fillStyle = rgba([214,208,235], m.a * (0.6 + 0.4 * Math.sin(m.ph)));
    ctx.beginPath(); ctx.arc(m.x, m.y, m.s, 0, 7); ctx.fill();
  }
  ctx.globalCompositeOperation = "source-over";

  for (const o of orbs) {
    if (!o.alive) continue;
    ctx.globalCompositeOperation = "lighter";
    const halo = ctx.createRadialGradient(o.x, o.y, o.r * 0.6, o.x, o.y, o.r * 2.2);
    halo.addColorStop(0, rgba(o.paint.glow, 0.18)); halo.addColorStop(1, rgba(o.paint.glow, 0));
    ctx.fillStyle = halo; ctx.beginPath(); ctx.arc(o.x, o.y, o.r * 2.2, 0, 7); ctx.fill();
    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = rgba(o.paint.fill, 1);
    ctx.beginPath(); ctx.arc(o.x, o.y, o.r, 0, 7); ctx.fill();
    ctx.globalCompositeOperation = "lighter";
    ctx.fillStyle = "rgba(255,255,255,0.14)";
    ctx.beginPath(); ctx.arc(o.x - o.r * 0.38, o.y - o.r * 0.42, o.r * 0.26, 0, 7); ctx.fill();
    ctx.globalCompositeOperation = "source-over";
  }

  ctx.globalCompositeOperation = "lighter";
  for (const r of rings) {
    ctx.strokeStyle = rgba(r.paint.glow, Math.max(0, r.life) * 0.4);
    ctx.lineWidth = 1 + r.life * 2;
    ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, 7); ctx.stroke();
  }
  for (const p of particles) {
    const a = Math.max(0, p.life), s = p.s * (0.5 + a * 0.5);
    ctx.fillStyle = rgba(p.paint.glow, a); ctx.strokeStyle = rgba(p.paint.glow, a);
    const ang = Math.atan2(p.vy, p.vx);
    if (p.pop.shape === "spark") {
      ctx.lineWidth = Math.max(0.8, s * 0.6);
      ctx.beginPath();
      ctx.moveTo(p.x - Math.cos(ang) * s * 1.8, p.y - Math.sin(ang) * s * 1.8);
      ctx.lineTo(p.x + Math.cos(ang) * s * 1.8, p.y + Math.sin(ang) * s * 1.8);
      ctx.stroke();
    } else if (p.pop.shape === "petal") {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(ang);
      ctx.beginPath(); ctx.ellipse(0, 0, s * 1.5, s * 0.7, 0, 0, 7); ctx.fill(); ctx.restore();
    } else if (p.pop.shape === "shard") {
      ctx.beginPath();
      ctx.moveTo(p.x + Math.cos(ang) * s * 1.7, p.y + Math.sin(ang) * s * 1.7);
      ctx.lineTo(p.x + Math.cos(ang + 2.4) * s, p.y + Math.sin(ang + 2.4) * s);
      ctx.lineTo(p.x + Math.cos(ang - 2.4) * s, p.y + Math.sin(ang - 2.4) * s);
      ctx.closePath(); ctx.fill();
    } else if (p.pop.shape === "ring") {
      ctx.lineWidth = Math.max(0.7, s * 0.45);
      ctx.beginPath(); ctx.arc(p.x, p.y, s, 0, 7); ctx.stroke();
    } else {
      ctx.beginPath(); ctx.arc(p.x, p.y, s, 0, 7); ctx.fill();
    }
  }
  ctx.font = "italic 11px " + getComputedStyle(document.body).getPropertyValue("--serif");
  ctx.textAlign = "center";
  for (const n of notes) {
    ctx.fillStyle = rgba([210,202,232], Math.max(0, Math.min(1, n.life)) * 0.85);
    ctx.fillText(n.text, n.x, n.y);
  }
  ctx.globalCompositeOperation = "source-over";
}

let last = performance.now();
function frame(t) {
  const f = Math.min(Math.max((t - last) / 1000, 0), 0.05) * 60;
  last = t;
  step(f); draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---------- HUD helpers ----------
function setText(id, v) { document.getElementById(id).textContent = v; }
function flash(id, text, ms) {
  const el = document.getElementById(id);
  el.innerHTML = id === "unlock" ? "<span>✦ " + text + "</span>" : text;
  el.classList.add("show");
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove("show"), ms);
}
function showFortune() {
  stats.fortunes++;
  setText("fortunemsg", "Whatever you just popped, it wasn't real anyway.");
  const wrap = document.getElementById("fortunewrap");
  wrap.classList.add("show");
  setTimeout(() => wrap.classList.remove("show"), 3600);
}
function tapMarker(x, y) {
  const d = document.getElementById("tapdot");
  d.style.left = x + "px"; d.style.top = y + "px";
  d.classList.remove("go"); void d.offsetWidth; d.classList.add("go");
}

// ---------- the director ----------
const sleep = ms => new Promise(r => setTimeout(r, ms));

const LAYOUT = [
  { x: 0.22, y: 0.30, r: 30, pop: "vesper" },
  { x: 0.72, y: 0.22, r: 22, pop: "vesper" },
  { x: 0.84, y: 0.44, r: 26, pop: "ember" },
  { x: 0.40, y: 0.46, r: 19, pop: "clover", fortune: true },
  { x: 0.15, y: 0.60, r: 33, pop: "tide" },
  { x: 0.60, y: 0.55, r: 24, pop: "vesper" },
  { x: 0.68, y: 0.63, r: 21, pop: "ember" },
  { x: 0.76, y: 0.71, r: 25, pop: "frost" },
  { x: 0.30, y: 0.78, r: 21, pop: "chime" },
  { x: 0.52, y: 0.87, r: 25, pop: "vesper" },
  { x: 0.12, y: 0.89, r: 20, pop: "pearl" },
];

async function tapOrb(i) {
  const o = orbs[i];
  if (!o || !o.alive) return;
  tapMarker(o.x, o.y);
  await sleep(70);
  detonate(o, false);
}

function doneSequence() {
  sessionPts += 100;
  totalPts += 100;
  stats.fields++;
  setText("pts", sessionPts + " pop points");
  playChime();
  const stone = mapStones.find(s => s.id === activeStoneId);
  if (stone && !stone.cleared) {
    stone.cleared = true;
    const roads = spawnRoads(stone);
    if (roads.length) {
      flash("unlock", roads.length === 1 ? "the path continues"
                                         : "the path forks — " + roads.length + " roads ahead", 3200);
    }
  }
  setText("donesub", "You cleared all " + count + " orbs.");
  document.getElementById("donesub").insertAdjacentHTML(
    "beforeend", "<br>Nothing left to worry about — for now.");
  setText("donepts", "+" + sessionPts + " pop points");
  setText("donelife", lifetime.toLocaleString() + " set free, all time.");
  document.getElementById("scrim").classList.add("show");
  document.getElementById("donewrap").classList.add("show");
  if (!manual) setTimeout(nextField, 4200);   // the director moves on by itself
}

function nextField() {
  if (!doneShown) return;
  document.getElementById("scrim").classList.remove("show");
  document.getElementById("donewrap").classList.remove("show");
  setTimeout(() => {
    seedMotes();
    seedField(manual ? currentLayout() : LAYOUT);
    doneShown = false;
  }, 500);
}
document.getElementById("goagain").addEventListener("pointerdown", e => {
  e.stopPropagation();
  nextField();
});

// ---------- top bar & sheets (the Path, the Journey, settings) ----------
const ICONS = {
  gear: '<svg width="19" height="19" viewBox="0 0 20 20"><circle cx="10" cy="10" r="3.2"/><path d="M10 2v2.4M10 15.6V18M2 10h2.4M15.6 10H18M4.3 4.3l1.7 1.7M14 14l1.7 1.7M15.7 4.3L14 6M6 14l-1.7 1.7"/></svg>',
  path: '<svg width="20" height="20" viewBox="0 0 20 20"><circle cx="4" cy="16" r="1.8"/><circle cx="10" cy="7" r="1.8"/><circle cx="16" cy="14" r="1.8"/><path stroke-dasharray="1.5 2.5" d="M5.2 14.4 L8.8 8.6 M11.4 8 L14.8 12.8"/></svg>',
  sparkles: '<svg width="19" height="19" viewBox="0 0 20 20"><path d="M10 3 L11.2 8.8 L17 10 L11.2 11.2 L10 17 L8.8 11.2 L3 10 L8.8 8.8 Z" fill="#ECEAF4" stroke="none"/></svg>',
  reload: '<svg width="19" height="19" viewBox="0 0 20 20"><path d="M16 10a6 6 0 1 1-1.8-4.3"/><path d="M16 2.8 V6 H12.8"/></svg>',
};

function closeSheet() {
  sheetOpen = null;
  document.getElementById("sheetroot").innerHTML = "";
}

function sheetShell(title, subtitle) {
  const root = document.getElementById("sheetroot");
  root.innerHTML = "";
  const sheet = document.createElement("div");
  sheet.className = "sheet";
  sheet.innerHTML = '<div class="grabber"></div><h1>' + title + "</h1>" +
    (subtitle ? '<div class="subtitle">' + subtitle + "</div>" : "") +
    '<div class="x">✕</div>';
  sheet.querySelector(".x").addEventListener("pointerdown", closeSheet);
  root.appendChild(sheet);
  return sheet;
}

function fillColor(popName) {
  const p = POPS[popName].paints[0];
  return rgba(p.fill, 1);
}

function openPath() {
  sheetOpen = "path";
  const sheet = sheetShell("The Path", "each stone is a field of its own pops");
  const gens = mapStones.map(s => s.gen);
  const minG = Math.min(...gens), maxG = Math.max(...gens);
  const rowH = 120, topPad = 60;
  const mapH = (maxG - minG + 1) * rowH + topPad + 40;
  const map = document.createElement("div");
  map.className = "pathmap";
  map.style.height = mapH + "px";
  sheet.appendChild(map);

  const mw = W - 48;
  const pt = s => ({ x: 34 + s.lane * (mw - 68), y: topPad + (maxG - s.gen) * rowH });
  const rc = document.createElement("canvas");
  rc.className = "roads";
  rc.width = mw; rc.height = mapH;
  map.appendChild(rc);
  const rctx = rc.getContext("2d");
  for (const s of mapStones) {
    const parent = mapStones.find(x => x.id === s.parent);
    if (!parent) continue;
    const A = pt(parent), B = pt(s);
    rctx.strokeStyle = parent.id === activeStoneId ? "rgba(195,175,220,0.35)"
                                                   : "rgba(255,255,255,0.12)";
    rctx.lineWidth = 1;
    rctx.setLineDash([2, 6]);
    rctx.beginPath();
    rctx.moveTo(A.x, A.y);
    rctx.bezierCurveTo(A.x, A.y - rowH * 0.45, B.x, B.y + rowH * 0.45, B.x, B.y);
    rctx.stroke();
  }
  for (const s of mapStones) {
    const p = pt(s);
    const d = document.createElement("div");
    d.className = "stone" + (s.id === activeStoneId ? " active" : "") + (s.cleared ? " cleared" : "");
    d.style.left = p.x + "px"; d.style.top = p.y + "px";
    d.innerHTML = '<div class="circ">' +
      s.pops.map(x => '<span class="pd" style="background:' + fillColor(x) + '"></span>').join("") +
      (s.cleared ? '<span class="check">✓</span>' : "") +
      '</div><div class="nm">' + s.pops.map(x => NAMES[x]).join(" · ") + "</div>";
    d.addEventListener("pointerdown", () => {
      activeStoneId = s.id;
      manual = true;
      doneShown = false;
      document.getElementById("scrim").classList.remove("show");
      document.getElementById("donewrap").classList.remove("show");
      document.getElementById("soundhint").style.opacity = 0;
      seedMotes();
      seedField(makeLayout(s.pops));
      closeSheet();
    });
    map.appendChild(d);
  }
  const cap = document.createElement("div");
  cap.className = "pathcap";
  cap.textContent = mapStones.length === 1
    ? "step on the stone to begin"
    : "in the full game, the road behind fades after three days";
  sheet.appendChild(cap);
}

function openJourney() {
  sheetOpen = "journey";
  const sheet = sheetShell("The Journey", "");
  sheet.insertAdjacentHTML("beforeend",
    '<div class="jpoints">' + totalPts.toLocaleString() + '</div>' +
    '<div class="label">Pop points</div>' +
    '<div class="records">' +
    [[stats.pops, "set free"], [stats.fields, "fields"],
     [stats.fortunes, "fortunes"], [stats.best, "best chain"]]
      .map(([v, k]) => '<div class="rec"><div class="v">' + v + '</div><div class="k">' + k + "</div></div>").join("") +
    "</div>" +
    '<div class="label" style="display:block;margin-top:22px;">Collection · demo pops</div>' +
    '<div class="cells">' +
    Object.keys(POPS).map(k =>
      '<div class="cell"><span class="dot" style="background:' + fillColor(k) + '"></span>' +
      '<span class="nm">' + NAMES[k] + '</span>' +
      '<span class="ct">' + (perPop[k] ? "×" + perPop[k] : "· · ·") + "</span></div>").join("") +
    "</div>" +
    '<div class="sheetnote">the full game holds 100 pops across ten families —<br>' +
    'embers, tides, blooms, frost, chimes, lanterns, and three secrets</div>');
}

function toggleRow(sheet, title, sub, get, set) {
  const row = document.createElement("div");
  row.className = "togglerow";
  row.innerHTML = '<div><div class="t1">' + title + '</div><div class="t2">' + sub + "</div></div>" +
    '<div class="switch' + (get() ? " on" : "") + '"></div>';
  row.addEventListener("pointerdown", () => {
    set(!get());
    row.querySelector(".switch").classList.toggle("on", get());
  });
  sheet.appendChild(row);
}

function openSettings() {
  sheetOpen = "settings";
  const sheet = sheetShell("Settings", "");
  toggleRow(sheet, "Sound", "Soft pops and a chime",
            () => soundOn, v => soundOn = v);
  toggleRow(sheet, "Point whispers", "Little +points that drift up from a pop",
            () => whispersOn, v => whispersOn = v);
  sheet.insertAdjacentHTML("beforeend",
    '<div class="sheetnote">demo build · the app adds haptics, Reduce Motion,<br>' +
    'VoiceOver, and remembers your journey</div>');
}

const topbar = document.getElementById("topbar");
function topBtn(icon, fn) {
  const b = document.createElement("div");
  b.className = "btn";
  b.innerHTML = ICONS[icon];
  b.addEventListener("pointerdown", e => { e.stopPropagation(); enableSound(); fn(); });
  topbar.appendChild(b);
}
topBtn("gear", () => sheetOpen === "settings" ? closeSheet() : openSettings());
topBtn("path", () => sheetOpen === "path" ? closeSheet() : openPath());
const sp = document.createElement("div");
sp.className = "spacer";
topbar.appendChild(sp);
topBtn("sparkles", () => sheetOpen === "journey" ? closeSheet() : openJourney());
topBtn("reload", () => {
  manual = true;
  doneShown = false;
  closeSheet();
  document.getElementById("scrim").classList.remove("show");
  document.getElementById("donewrap").classList.remove("show");
  document.getElementById("soundhint").style.opacity = 0;
  seedMotes();
  seedField(currentLayout());
});

// the director plays until you take over
async function run() {
  seedMotes();
  seedField(LAYOUT);
  const beats = [
    [2200, 0], [1300, 1], [1100, 4], [1500, 3], [600, -1],
    [3400, 5], [500, -1], [2600, -2], [1400, 2], [900, 8],
    [800, 9], [800, 10], [700, -1],
  ];
  while (true) {
    if (manual) return;
    if (!doneShown) {
      for (const [wait, orb] of beats) {
        await sleep(wait);
        if (manual || doneShown) break;
        if (orb === -2) flash("unlock", "new pop · Gloaming", 3200);
        else if (orb >= 0) await tapOrb(orb);
      }
      // anything the chains missed
      while (!manual && !doneShown && orbs.some(o => o.alive)) {
        const i = orbs.findIndex(o => o.alive);
        await tapOrb(i); await sleep(650);
      }
    }
    await sleep(400);
  }
}
run();
